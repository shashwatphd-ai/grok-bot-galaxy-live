<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading… — Grok Bot Galaxy</title>
<meta name="description" content="Long reads from the Grok Bot Galaxy product tracker: the running commentary log, day retrospectives, and stream transcripts.">
<style>
  :root {
    --bg: #0a0a0f; --card: #13131c; --card2: #1a1a26; --line: #26263a;
    --text: #e8e8f0; --muted: #9a9ab0; --dim: #6f6f88;
    --accent: #ff2d78; --accent2: #4fc3f7; --gold: #ffc857;
    --green: #38e07b; --purple: #b39dff;
    --mono: ui-monospace, Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
  }
  a { color: var(--accent2); }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }

  .topbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 14px;
    background: rgba(10,10,15,.93); border-bottom: 1px solid var(--line);
    padding: 9px 18px; font-size: 13px; color: var(--muted);
    backdrop-filter: blur(6px);
  }
  .topbar .grow { flex: 1; }
  .back {
    color: var(--muted); text-decoration: none; font-weight: 700; font-size: 12.5px;
    border: 1px solid var(--line); border-radius: 20px; padding: 5px 14px; white-space: nowrap;
  }
  .back:hover { color: var(--text); border-color: var(--accent); }
  .brand { white-space: nowrap; font-size: 13px; }
  .brand b { color: var(--accent); }

  .page { max-width: 780px; margin: 0 auto; padding: 26px 18px 90px; }

  /* loader: bot blobs orbiting the wordmark */
  .galaxy-load { position: relative; text-align: center; padding: 60px 0 40px; }
  .gl-word { font-size: 20px; font-weight: 800; letter-spacing: -.3px; }
  .gl-word b { color: var(--accent); }
  .gl-sub { margin-top: 8px; font-size: 12.5px; color: var(--dim); }
  .orbits { position: relative; height: 70px; margin-top: 12px; }
  .orbit { position: absolute; left: 50%; top: 50%; width: 0; height: 0; animation: gspin 1.2s linear infinite; }
  .orbit .dot { position: absolute; left: -4px; top: -32px; width: 8px; height: 8px; border-radius: 50%; display: block; }
  .orbit .dot.r2 { top: -15px; left: -3px; width: 6px; height: 6px; opacity: .8; }
  .galaxy-load .dot.c0 { background: var(--accent); }
  .galaxy-load .dot.c1 { background: var(--accent2); }
  .galaxy-load .dot.c2 { background: var(--gold); }
  .galaxy-load .dot.c3 { background: var(--green); }
  .galaxy-load .dot.c4 { background: var(--purple); }
  @keyframes gspin { to { transform: rotate(360deg); } }

  /* the document */
  .doc {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 30px 32px 34px;
  }
  .doc h1 { font-size: 26px; font-weight: 800; letter-spacing: -.4px; line-height: 1.3; margin-bottom: 18px; }
  .doc h2 { font-size: 20px; font-weight: 800; letter-spacing: -.2px; margin: 30px 0 12px; }
  .doc h3 { font-size: 16.5px; font-weight: 700; margin: 22px 0 10px; color: #f0ecf6; }
  .doc p { font-size: 15px; line-height: 1.75; color: #c9c9da; margin-bottom: 13px; }
  .doc li { font-size: 15px; line-height: 1.75; color: #c9c9da; margin-bottom: 9px; }
  .doc ul, .doc ol { padding-left: 24px; margin-bottom: 15px; }
  .doc strong { color: var(--text); }
  .doc blockquote {
    margin: 14px 0; padding: 10px 16px; border-left: 3px solid var(--accent2);
    background: rgba(79,195,247,.05); border-radius: 0 8px 8px 0; color: var(--muted);
  }
  .doc blockquote p { margin-bottom: 0; }
  .doc code {
    font-family: var(--mono); font-size: 13px; background: var(--card2);
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--gold);
  }
  .doc pre { background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin-bottom: 15px; }
  .doc pre code { border: 0; background: none; padding: 0; }
  .doc hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
  .doc a { word-break: break-word; }

  .errcard {
    background: var(--card); border: 1px solid rgba(255,45,120,.4); border-radius: 14px;
    padding: 26px 28px; font-size: 15px; line-height: 1.7; color: #c9c9da;
  }
  .errcard h2 { font-size: 18px; margin-bottom: 10px; color: var(--text); }
  .errcard ul { padding-left: 22px; margin-top: 10px; }
  .errcard li { margin-bottom: 6px; }

  footer { border-top: 1px solid var(--line); color: var(--dim); font-size: 12.5px; padding: 18px; line-height: 1.7; }
  footer .inner { max-width: 780px; margin: 0 auto; }

  @media (max-width: 640px) {
    .doc { padding: 22px 18px 26px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .orbit { animation: none !important; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="index.html">← Back to the tracker</a>
  <span class="grow"></span>
  <span class="brand">Grok Bot <b>Galaxy</b> · tracker reads</span>
</div>

<main class="page">
  <div id="loader" class="galaxy-load"></div>
  <article id="doc" class="doc" hidden></article>
  <div id="err" class="errcard" hidden></div>
</main>

<footer>
  <div class="inner">
    Part of the Grok Bot Galaxy product tracker. Times are Pacific. Reads are drawn from the stream and its transcripts.
  </div>
</footer>

<script>
(function () {
  var DOC_LIST = ["commentary-log.md", "retro-day1.md", "retro-day2.md", "retro-day3.md", "transcript-day1-visual.md", "transcript-day1-audio.md", "transcript-day2-audio.md", "day2-live-transcript.md", "transcript-day3-visual.md"];
  var motionOk = true;
  try { motionOk = !window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function buildGalaxy(container) {
    container.innerHTML = "";
    var w = el("div", "gl-word");
    w.appendChild(document.createTextNode("Grok Bot "));
    w.appendChild(el("b", null, "Galaxy"));
    container.appendChild(w);
    var o = el("div", "orbits");
    var cols = ["c0", "c1", "c2", "c3", "c4"];
    for (var i = 0; i < 12; i++) {
      var orb = el("div", "orbit");
      orb.style.animationDelay = (i * -0.1) + "s";
      orb.appendChild(el("i", "dot " + cols[i % 5] + (i % 2 ? " r2" : "")));
      o.appendChild(orb);
    }
    container.appendChild(o);
    container.appendChild(el("div", "gl-sub", "opening the file…"));
  }

  /* md:start — small markdown renderer for the subset our docs use:
     h1-h3, bold, italics, links, unordered/ordered lists, blockquotes,
     hr, inline code, fenced code. Escapes HTML before applying markup. */
  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function inline(s) {
    var out = esc(s);
    var codes = [];
    out = out.replace(/`([^`]+)`/g, function (_, c) {
      codes.push(c);
      return "\x01" + (codes.length - 1) + "\x01";
    });
    out = out.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, function (_, t, u) {
      var external = /^(https?:)?\/\//i.test(u);
      return '<a href="' + u + '"' + (external ? ' target="_blank" rel="noopener"' : "") + ">" + t + "</a>";
    });
    out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    out = out.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
    out = out.replace(/\x01(\d+)\x01/g, function (_, i) { return "<code>" + codes[+i] + "</code>"; });
    return out;
  }

  function mdToHtml(src) {
    var lines = String(src).replace(/\r\n?/g, "\n").split("\n");
    var html = [], para = [], list = null, quote = [], code = null;
    function flushP() { if (para.length) { html.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } }
    function flushL() { if (list) { html.push("</" + list + ">"); list = null; } }
    function flushQ() { if (quote.length) { html.push("<blockquote><p>" + inline(quote.join(" ")) + "</p></blockquote>"); quote = []; } }
    function flushAll() { flushP(); flushL(); flushQ(); }

    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];

      if (code !== null) {
        if (/^\s*```/.test(ln)) { html.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); code = null; }
        else code.push(ln);
        continue;
      }
      if (/^\s*```/.test(ln)) { flushAll(); code = []; continue; }

      var h = /^(#{1,6})\s+(.*)$/.exec(ln);
      if (h) {
        flushAll();
        var lvl = Math.min(h[1].length, 3);
        html.push("<h" + lvl + ">" + inline(h[2]) + "</h" + lvl + ">");
        continue;
      }
      if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(ln)) { flushAll(); html.push("<hr>"); continue; }

      var bq = /^\s*>\s?(.*)$/.exec(ln);
      if (bq) { flushP(); flushL(); quote.push(bq[1]); continue; }

      var ul = /^\s*[-*]\s+(.*)$/.exec(ln);
      if (ul) {
        flushP(); flushQ();
        if (list !== "ul") { flushL(); html.push("<ul>"); list = "ul"; }
        html.push("<li>" + inline(ul[1]) + "</li>");
        continue;
      }
      var ol = /^\s*\d+[.)]\s+(.*)$/.exec(ln);
      if (ol) {
        flushP(); flushQ();
        if (list !== "ol") { flushL(); html.push("<ol>"); list = "ol"; }
        html.push("<li>" + inline(ol[1]) + "</li>");
        continue;
      }

      if (!ln.trim()) { flushAll(); continue; }
      flushL(); flushQ();
      para.push(ln.trim());
    }
    if (code !== null) html.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
    flushAll();
    return html.join("\n");
  }
  /* md:end */

  function docName() {
    var raw = "";
    try { raw = new URLSearchParams(location.search).get("doc") || ""; } catch (e) { raw = ""; }
    if (!/^[A-Za-z0-9][A-Za-z0-9._-]*\.md$/.test(raw) || raw.indexOf("..") >= 0) return null;
    return raw;
  }

  function showError(name) {
    document.getElementById("loader").hidden = true;
    var err = document.getElementById("err");
    err.innerHTML = "";
    err.hidden = false;
    err.appendChild(el("h2", null, name ? "That file isn't here (yet)" : "No document asked for"));
    if (name) {
      err.appendChild(document.createTextNode("The tracker linked to " + name + ", but the file isn't at this address. If it's marked as posting soon, it hasn't gone up yet. The other reads are below, or head back to the tracker."));
    } else {
      err.appendChild(document.createTextNode("Pick a read:"));
    }
    var ul = el("ul");
    DOC_LIST.forEach(function (d) {
      var li = el("li");
      var a = el("a", null, d);
      a.href = "docs.html?doc=" + encodeURIComponent(d);
      li.appendChild(a);
      ul.appendChild(li);
    });
    err.appendChild(ul);
    document.title = "Not found — Grok Bot Galaxy";
  }

  function render(text, name) {
    document.getElementById("loader").hidden = true;
    var art = document.getElementById("doc");
    art.innerHTML = mdToHtml(text);
    art.hidden = false;
    var h1 = art.querySelector("h1");
    var title = h1 ? h1.textContent : name.replace(/\.md$/, "");
    document.title = title + " — Grok Bot Galaxy";
  }

  function fetchText(url) {
    return fetch(url, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    });
  }

  function load() {
    buildGalaxy(document.getElementById("loader"));
    var name = docName();
    if (!name) { showError(null); return; }
    var bust = "?cb=" + Date.now();
    /* site root (published): the file sits next to this page.
       /v3/ preview: sibling 404s, retry one level up. */
    fetchText(name + bust)
      .catch(function () { return fetchText("../" + name + bust); })
      .then(function (text) { render(text, name); })
      .catch(function () { showError(name); });
  }

  load();
})();
</script>
</body>
</html>
